<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Quest VR Teleop</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f0f0f0; }
        button { font-size: 20px; padding: 10px 20px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; background-color: #4CAF50; color: white; }
        #status { font-size: 18px; color: #333; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Meta Quest VR Teleop</h1>
    <p>Host: <span id="host-ip"></span></p>
    <button id="btn-enter-vr" style="display: none;">Enter VR</button>
    <div id="status">Connecting WebSocket...</div>

    <script>
        document.getElementById('host-ip').innerText = window.location.hostname;
        const statusDiv = document.getElementById('status');
        const btnEnterVR = document.getElementById('btn-enter-vr');

        let ws = null;
        let xrSession = null;
        let xrRefSpace = null;

        function connectWebSocket() {
            const wsUrl = `wss://${window.location.hostname}:8444`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDiv.innerText = "WebSocket Connected! Checking WebXR...";
                checkWebXR();
            };

            ws.onerror = (err) => {
                statusDiv.innerText = "WebSocket Error. Make sure WSS server is running on port 8444.";
                console.error("WS Error", err);
            };

            ws.onclose = () => {
                statusDiv.innerText = "WebSocket Disconnected. Reconnecting in 2s...";
                setTimeout(connectWebSocket, 2000);
            };
        }

        function checkWebXR() {
            if (navigator.xr) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        btnEnterVR.style.display = 'inline-block';
                        statusDiv.innerText = "WebXR Ready. Press Enter VR.";
                    } else {
                        statusDiv.innerText = "immersive-vr not supported on this browser.";
                    }
                });
            } else {
                statusDiv.innerText = "WebXR not available (navigator.xr is undefined). Are you on HTTPS?";
            }
        }

        btnEnterVR.addEventListener('click', () => {
            if (!xrSession) {
                navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['local-floor', 'bounded-floor']
                }).then(onSessionStarted);
            }
        });

        function onSessionStarted(session) {
            xrSession = session;
            btnEnterVR.style.display = 'none';
            statusDiv.innerText = "In VR Session";

            session.addEventListener('end', onSessionEnded);

            session.requestReferenceSpace('local').then((refSpace) => {
                xrRefSpace = refSpace;
                session.requestAnimationFrame(onXRFrame);
            });
        }

        function onSessionEnded(event) {
            xrSession = null;
            btnEnterVR.style.display = 'inline-block';
            statusDiv.innerText = "VR Session Ended.";
        }

        function onXRFrame(time, frame) {
            let session = frame.session;
            session.requestAnimationFrame(onXRFrame);

            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            let sentData = false;

            for (let source of session.inputSources) {
                if (source.handedness === 'right' && source.gripSpace) {
                    let pose = frame.getPose(source.gripSpace, xrRefSpace);
                    if (pose && source.gamepad) {
                        // Quest 3S controllers:
                        // buttons[0] = Index Trigger
                        // buttons[1] = Hand Trigger (Grip)
                        let triggerPressed = source.gamepad.buttons[0] && source.gamepad.buttons[0].pressed;
                        let gripPressed = source.gamepad.buttons[1] && source.gamepad.buttons[1].pressed;

                        let pos = pose.transform.position;
                        let quat = pose.transform.orientation;

                        let payload = {
                            t: Date.now() / 1000.0,
                            hand: "right",
                            pos: [pos.x, pos.y, pos.z],
                            quat: [quat.w, quat.x, quat.y, quat.z], // lưu ý: w trước
                            trigger: triggerPressed,
                            grip: gripPressed
                        };

                        ws.send(JSON.stringify(payload));
                        sentData = true;
                    }
                }
            }
        }

        // Start
        connectWebSocket();
    </script>
</body>
</html>
